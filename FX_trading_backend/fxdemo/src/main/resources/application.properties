spring.application.name=fxdemo
server.address=0.0.0.0
spring.datasource.url=jdbc:postgresql://localhost:5432/demofx
spring.datasource.username=demofx_user
spring.datasource.password=demofx_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
demofx.margin.loss-cut.enabled=true
demofx.margin.loss-cut.threshold-percent=50
demofx.margin.loss-cut.warning-percent=100
demofx.margin.loss-cut.evaluation-interval-seconds=2
demofx.margin.loss-cut.liquidation=ALL
demofx.margin.order.margin-check-enabled=true
