spring.application.name=fxdemo
server.address=0.0.0.0
spring.datasource.url=jdbc:postgresql://localhost:5432/demofx
spring.datasource.username=demofx_user
spring.datasource.password=demofx_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
demofx.margin.loss-cut.enabled=true
demofx.margin.loss-cut.threshold-percent=50
demofx.margin.loss-cut.warning-percent=100
demofx.margin.loss-cut.evaluation-interval-seconds=2
demofx.margin.loss-cut.liquidation=ALL
demofx.margin.order.margin-check-enabled=true
demofx.margin.evaluation.rate-policy=FIXED
demofx.margin.evaluation.aggregation-policy=SUM
demofx.pending-orders.enabled=true
demofx.pending-orders.evaluation-interval-seconds=1
demofx.swap.enabled=true
demofx.swap.rollover-time=06:00
demofx.swap.rates.[USD/JPY].long-rate=20
demofx.swap.rates.[USD/JPY].short-rate=-60
demofx.swap.rates.[EUR/JPY].long-rate=5
demofx.swap.rates.[EUR/JPY].short-rate=-35
demofx.swap.rates.[GBP/JPY].long-rate=30
demofx.swap.rates.[GBP/JPY].short-rate=-80
demofx.swap.rates.[EUR/USD].long-rate=-10
demofx.swap.rates.[EUR/USD].short-rate=5
demofx.swap.rates.[GBP/USD].long-rate=-8
demofx.swap.rates.[GBP/USD].short-rate=4
demofx.swap.rates.[AUD/USD].long-rate=6
demofx.swap.rates.[AUD/USD].short-rate=-18
demofx.swap.rates.[USD/CAD].long-rate=7
demofx.swap.rates.[USD/CAD].short-rate=-22
demofx.swap.rates.[USD/CHF].long-rate=18
demofx.swap.rates.[USD/CHF].short-rate=-40
