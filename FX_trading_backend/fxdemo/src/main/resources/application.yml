demofx:
  simulator:
    default:
      volatilityBps: 1.5
      reversionStrength: 0.01
      maxDeviationBps: 300
    pairs:
      - symbol: "USD/JPY"
        basePrice: 155.1215
      - symbol: "EUR/JPY"
        basePrice: 168.2525
      - symbol: "EUR/USD"
        basePrice: 1.085015
      - symbol: "GBP/USD"
        basePrice: 1.27000
      - symbol: "GBP/JPY"
        basePrice: 197.000
      - symbol: "AUD/USD"
        basePrice: 0.65000
      - symbol: "AUD/JPY"
        basePrice: 100.830
      - symbol: "USD/CHF"
        basePrice: 0.88000
      - symbol: "USD/CAD"
        basePrice: 1.37000
  news:
    enabled: true
    defaults:
      magnitudeBps: 60
      durationSeconds: 30
      volatilityMultiplier: 5.0
      spreadMultiplier: 4.0
    limits:
      maxMagnitudeBps: 500
      maxDurationSeconds: 300
    auto:
      enabled: false
      probabilityPerMinute: 0.2
    headlines:
      - "Fictional policy outlook shifts market expectations"
      - "Fictional economic indicator surprises market participants"
      - "Fictional risk sentiment changes abruptly"
      - "Fictional central bank commentary moves simulated prices"
      - "Fictional liquidity concern widens simulated spreads"
  alerts:
    enabled: true
    evaluationIntervalSeconds: 3
    history:
      maxEntries: 100
    rules:
      spread:
        enabled: true
        limit: 60
      rapidMove:
        enabled: true
        lookbackSeconds: 15
        warnBps: 30
        criticalBps: 60
      staleData:
        enabled: true
        warnSeconds: 10
        criticalSeconds: 30
      crossedQuote:
        enabled: true
      volatilitySurge:
        enabled: false
        lookbackSeconds: 60
        baselineLookbackSeconds: 600
        baselineMultiplier: 3.0
  equityHistory:
    enabled: true
    intervalSeconds: 5
