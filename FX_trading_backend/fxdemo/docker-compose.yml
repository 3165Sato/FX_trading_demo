services:
  postgres:
    image: postgres:16
    container_name: demofx-postgres
    environment:
      POSTGRES_DB: demofx
      POSTGRES_USER: demofx_user
      POSTGRES_PASSWORD: demofx_password
    ports:
      - "5432:5432"
    volumes:
      - demofx-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: demofx-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - demofx-redis-data:/data

volumes:
  demofx-postgres-data:
  demofx-redis-data:
